name: CI
permissions:
  contents: read

# Template — copy into a consuming plugin repo as .github/workflows/ci.yml.
# Calls this package's reusable quality-checks.yml so the actual check
# logic lives in one place (SilverAssist/wp-coding-standards) instead of
# being copy-pasted per plugin.
#
# Before copying: check the target repo's actual default branch (`main`
# vs `master`) and update the two `branches:` filters below to match --
# a mismatch here means these jobs silently never run on push/PR against
# the default branch. Found the hard way on silver-assist-post-revalidate,
# whose default branch is `master`.
#
# The `compatibility` job below calls `scripts/install-wp-tests.sh` — add
# a thin wrapper at that path delegating to
# vendor/silverassist/wp-coding-standards/scripts/install-wp-tests.sh
# (see this package's README, "Usage — Shared Scripts") rather than a
# full local copy, so any existing docs/dev commands referencing that
# path keep working.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality-checks-82:
    name: Quality Checks (PHP 8.2)
    uses: SilverAssist/wp-coding-standards/.github/workflows/quality-checks.yml@v1
    with:
      php-version: "8.2"
      skip-wp-setup: false
      # Only set true if the target repo's phpunit run actually generates
      # coverage.xml (e.g. phpunit.xml.dist has a <coverage> clover
      # report configured) -- quality-checks.yml uploads that exact path
      # and silently no-ops otherwise.
      upload-coverage: false

  quality-checks-83:
    name: Quality Checks (PHP 8.3)
    uses: SilverAssist/wp-coding-standards/.github/workflows/quality-checks.yml@v1
    with:
      php-version: "8.3"
      skip-wp-setup: false
      upload-coverage: false

  quality-checks-84:
    name: Quality Checks (PHP 8.4)
    uses: SilverAssist/wp-coding-standards/.github/workflows/quality-checks.yml@v1
    with:
      php-version: "8.4"
      skip-wp-setup: false
      upload-coverage: false

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, intl
          coverage: none
      - run: composer install --no-interaction --no-progress --optimize-autoloader
      - run: composer audit

  compatibility:
    name: WordPress Compatibility
    runs-on: ubuntu-latest
    strategy:
      matrix:
        wordpress-version: ["6.5", "6.6", "6.7", "latest"]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, intl, mysql, pdo_mysql
          coverage: none
      - run: composer install --no-interaction --no-progress --optimize-autoloader
      - run: bash scripts/install-wp-tests.sh wordpress_test root 'root' 127.0.0.1 ${{ matrix.wordpress-version }} false
      - run: vendor/bin/phpunit
